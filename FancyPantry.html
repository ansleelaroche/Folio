<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>FancyPantry Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        body { 
            background-color: #0b0f17; /* Slate dark background from dashboard */
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Accurate Screen Color Palette Styles */
        .color-dairy { color: #bae6fd; }
        .color-produce { color: #fde68a; }
        .color-condiments { color: #fcd34d; }
        .color-protein { color: #fca5a5; }
        .color-drinks { color: #93c5fd; }
        .color-outofstock { color: #fb7185; }

        .border-dairy { border-color: rgba(186, 230, 253, 0.2); }
        .border-produce { border-color: rgba(253, 230, 138, 0.2); }
        .border-condiments { border-color: rgba(252, 211, 77, 0.2); }

        /* Custom Scrollbars */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #21262d; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const supabaseUrl = 'https://jqvuqfqedzlegxuvudag.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdnVxZnFlZHpsZWd4dXZ1ZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzOTk3NDQsImV4cCI6MjA5MDk3NTc0NH0.kj2jjfHxZNLr6EHQgRrEJMYJpsqM5Nefi-51Lb1mqWw'; 
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const META = {
        "Produce": ["leaf", "#fde68a"], 
        "Dairy": ["milk", "#bae6fd"], 
        "Protein": ["bone", "#fca5a5"],
        "Drinks": ["droplets", "#93c5fd"], 
        "Condiments": ["utensils", "#fcd34d"], 
        "Snacks": ["zap", "#fdba74"],
        "Prepared Meals": ["package", "#cbd5e1"], 
        "Frozen Veg & Fruit": ["wind", "#4ade80"], 
        "Desserts": ["ice-cream", "#f9a8d4"], 
        "Bakery & Breads": ["wheat", "#fde68a"], 
        "Pasta & Grains": ["shrub", "#d9f99d"], 
        "Cereal": ["box-select", "#bfdbfe"], 
        "Cans & Jars": ["container", "#e5e7eb"], 
        "Baking Essentials": ["cookie", "#fbcfe8"], 
        "Spreads & Jars": ["cup-soda", "#ddd6fe"], 
        "Sides": ["list-todo", "#a7f3d0"], 
        "Supplies": ["cog", "#d4d4d8"], 
        "Dishware": ["utensils-2", "#d4d4d8"], 
        "Misc": ["more-horizontal", "#d4d4d8"]
    };

    const AUTO_MAP = {
        "Produce": ["apple", "banana", "onion", "garlic", "lettuce", "tomato", "potato", "berry", "fruit", "veg", "cucumber"],
        "Dairy": ["milk", "cheese", "yogurt", "butter", "cream", "egg", "sour cream", "parmesan", "provalone"],
        "Protein": ["chicken", "beef", "pork", "steak", "turkey", "tofu", "tempeh", "sausage", "bacon", "eggs", "ham", "fish", "shrimp", "salmon", "cod", "tuna", "meat", "seafood"],
        "Drinks": ["water", "juice", "soda", "coke", "beer", "wine", "coffee", "tea", "seltz"],
        "Condiments": ["sauce", "mayo", "ketchup", "mustard", "oil", "vinegar", "dressing", "jam", "jelly", "honey", "syrup", "relish", "ranch", "soy"],
        "Frozen Veg & Fruit": ["frozen veg", "frozen fruit", "mixed veg", "peas", "corn"]
    };

    const getMeta = (catName) => {
        let searchName = catName.toLowerCase().trim();
        if (searchName.includes("meats") || searchName.includes("seafood")) searchName = "protein";
        const match = Object.keys(META).find(k => k.toLowerCase() === searchName);
        return META[match] || META["Misc"];
    };

    function PantryApp() {
        const [activeRoom, setActiveRoom] = useState("Fridge");
        const [items, setItems] = useState([]);
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [editValue, setEditValue] = useState("");
        const [editQty, setEditQty] = useState("");
        const [newName, setNewName] = useState("");
        const [newQty, setNewQty] = useState("");
        const [modalRoom, setModalRoom] = useState("Fridge");
        const [modalCat, setModalCat] = useState("Misc");

        useEffect(() => { fetchItems(); }, []);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [items, activeRoom, editingId, isModalOpen]);

        async function fetchItems() {
            const { data } = await supabase.from('FancyPantry').select('*').order('name');
            if (data) setItems(data);
        }

        const handleNameChange = (val) => {
            setNewName(val);
            const lowerVal = val.toLowerCase();
            for (const [cat, keywords] of Object.entries(AUTO_MAP)) {
                if (keywords.some(k => lowerVal.includes(k))) { setModalCat(cat); break; }
            }
        };

        const handleUpdate = async (id) => {
            await supabase.from('FancyPantry').update({ name: editValue, qty: editQty }).eq('id', id);
            setEditingId(null); fetchItems();
        };

        const grouped = useMemo(() => {
            const target = activeRoom.toLowerCase().replace(/\s/g, '');
            let filtered = items.filter(i => {
                const dbRoom = (i.room || "").toLowerCase().replace(/\s/g, '');
                if (target === "shoppinglist") return parseFloat(i.qty || 0) === 0;
                return dbRoom === target;
            });
            const sorted = [...filtered].sort((a, b) => {
                const aQty = parseFloat(a.qty || 0), bQty = parseFloat(b.qty || 0);
                if (aQty === 0 && bQty > 0) return 1;
                if (aQty > 0 && bQty === 0) return -1;
                return a.name.localeCompare(b.name);
            });
            return sorted.reduce((acc, i) => {
                let rawCat = i.category || "Misc";
                if (rawCat.toLowerCase().includes("meats") || rawCat.toLowerCase().includes("seafood")) rawCat = "Protein";
                const matchKey = Object.keys(META).find(k => k.toLowerCase() === rawCat.toLowerCase().trim()) || "Misc";
                if (!acc[matchKey]) acc[matchKey] = [];
                acc[matchKey].push(i);
                return acc;
            }, {});
        }, [items, activeRoom]);

        const columnedCategories = useMemo(() => {
            const cols = [[], [], []];
            const sortedActiveCats = Object.keys(grouped).sort();
            sortedActiveCats.forEach((cat, index) => {
                cols[index % 3].push(cat);
            });
            return cols;
        }, [grouped]);

        return (
            <div className="min-height-screen flex flex-col md:flex-row bg-[#0b0f17]">
                
                {/* DESKTOP SIDEBAR / MOBILE HEADER */}
                <aside className="w-full md:w-64 bg-[#141923] border-b md:border-b-0 md:border-r border-[#222936] flex flex-col justify-between shrink-0 p-4 md:p-6 z-20">
                    <div>
                        <div className="flex items-center gap-3 mb-6 md:mb-10">
                            <div className="w-8 h-8 rounded-lg bg-teal-500/20 flex items-center justify-center">
                                <i data-lucide="layers" className="w-4 h-4 text-teal-400"></i>
                            </div>
                            <h1 className="text-lg font-bold tracking-tight text-white">FancyPantry</h1>
                        </div>

                        {/* NAV ITEMS */}
                        <nav className="flex md:flex-col gap-1 overflow-x-auto md:overflow-x-visible no-scrollbar pb-3 md:pb-0">
                            {["Fridge", "Freezer", "Dry Goods", "Shopping List"].map(room => {
                                const isActive = activeRoom === room;
                                const icons = { "Fridge": "refrigerator", "Freezer": "snowflake", "Dry Goods": "package", "Shopping List": "shopping-cart" };
                                return (
                                    <button 
                                        key={room} 
                                        onClick={() => setActiveRoom(room)}
                                        className={`flex items-center gap-3 px-4 py-2.5 rounded-lg text-xs font-semibold tracking-wide transition-all uppercase ${isActive ? 'bg-[#1e2533] text-white shadow-sm' : 'text-gray-400 hover:text-gray-200 hover:bg-[#1a202c]'}`}
                                    >
                                        <i data-lucide={icons[room]} className="w-4 h-4"></i>
                                        <span className="hidden md:inline">{room}</span>
                                    </button>
                                );
                            })}
                        </nav>
                    </div>

                    <button 
                        onClick={() => {setModalRoom(activeRoom === "Shopping List" ? "Fridge" : activeRoom); setIsModalOpen(true)}}
                        className="hidden md:flex items-center justify-center gap-2 w-full bg-teal-500 hover:bg-teal-600 text-[#0b0f17] font-bold text-xs tracking-wider uppercase py-3 rounded-lg shadow-lg shadow-teal-500/10 transition-all mt-6"
                    >
                        <i data-lucide="plus" className="w-4 h-4 stroke-[3]"></i>
                        Add Product
                    </button>
                </aside>

                {/* MAIN DASHBOARD MATRIX */}
                <main className="flex-1 p-4 md:p-8 overflow-y-auto custom-scroll max-w-7xl mx-auto w-full">
                    <header className="flex justify-between items-center mb-6 md:mb-8">
                        <div>
                            <h2 className="text-xl md:text-2xl font-black text-white tracking-tight capitalize">{activeRoom}</h2>
                            <p className="text-[11px] uppercase tracking-widest text-gray-500 mt-0.5">Active Operational Domain</p>
                        </div>
                    </header>

                    {/* DYNAMIC LIST COLS */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        {columnedCategories.flatMap(col => col).map(cat => {
                            const meta = getMeta(cat);
                            return (
                                <div key={cat} className="bg-[#141923] border border-[#222936] rounded-xl p-4 md:p-5 flex flex-col shadow-sm">
                                    <div className="flex items-center gap-2.5 border-b border-[#222936] pb-3 mb-4">
                                        <i data-lucide={meta[0]} style={{ color: meta[1] }} className="w-4 h-4"></i>
                                        <h3 className="text-xs font-bold uppercase tracking-widest" style={{ color: meta[1] }}>{cat}</h3>
                                    </div>
                                    
                                    <ul className="space-y-2.5 divide-y divide-[#1e2533]/40">
                                        {grouped[cat].map(item => {
                                            const isOut = parseFloat(item.qty) === 0;
                                            return (
                                                <li key={item.id} className="pt-2.5 first:pt-0">
                                                    {editingId === item.id ? (
                                                        <div className="flex gap-2 items-center bg-[#0b0f17] p-1.5 rounded border border-[#222936]">
                                                            <input className="bg-transparent text-xs text-white outline-none px-1 flex-1" value={editValue} onChange={e => setEditValue(e.target.value)} autoFocus />
                                                            <input className="bg-transparent text-xs text-center text-gray-400 w-10 font-bold outline-none border-l border-[#222936]" value={editQty} onChange={e => setEditQty(e.target.value)} />
                                                            <button onClick={() => handleUpdate(item.id)} className="bg-teal-500 text-[#0b0f17] text-[10px] font-black px-2 py-1 rounded">SAVE</button>
                                                        </div>
                                                    ) : (
                                                        <div 
                                                            onClick={() => { setEditingId(item.id); setEditValue(item.name); setEditQty(item.qty); }}
                                                            className="flex justify-between items-center group cursor-pointer"
                                                        >
                                                            <span className={`text-xs font-medium tracking-wide transition-colors ${isOut ? 'color-outofstock line-through opacity-70' : 'text-gray-200'}`}>
                                                                {item.name}
                                                            </span>
                                                            <div className="flex items-center gap-3">
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${isOut ? 'bg-red-500/10 color-outofstock' : 'bg-[#1e2533] text-gray-400'}`}>
                                                                    x{item.qty}
                                                                </span>
                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); if(confirm("Discard product line?")) supabase.from('FancyPantry').delete().eq('id', item.id).then(fetchItems); }}
                                                                    className="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-red-400 text-xs transition-opacity"
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>
                            );
                        })}
                    </div>
                </main>

                {/* MOBILE FAB */}
                <button 
                    onClick={() => {setModalRoom(activeRoom === "Shopping List" ? "Fridge" : activeRoom); setIsModalOpen(true)}}
                    className="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-teal-500 text-[#0b0f17] rounded-full shadow-lg shadow-teal-500/20 flex items-center justify-center z-50 active:scale-95 transition-transform"
                >
                    <i data-lucide="plus" className="w-6 h-6 stroke-[2.5]"></i>
                </button>

                {/* SYSTEM OVERLAY DIALOG (MODAL) */}
                {isModalOpen && (
                    <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center p-0 md:p-4 bg-black/70 backdrop-blur-sm">
                        <div className="bg-[#141923] w-full md:max-w-md p-6 md:p-8 border-t md:border border-[#222936] rounded-t-2xl md:rounded-xl shadow-2xl space-y-6 animate-slide-up">
                            <div className="flex justify-between items-center border-b border-[#222936] pb-3">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-white">Initialize Inventory Input</h3>
                                <button onClick={() => setIsModalOpen(false)} className="text-gray-500 hover:text-white">✕</button>
                            </div>

                            <form onSubmit={async e => {
                                e.preventDefault();
                                await supabase.from('FancyPantry').insert([{ name: newName, qty: newQty || "1", room: modalRoom, category: modalCat }]);
                                setIsModalOpen(false); setNewName(""); fetchItems();
                            }} className="space-y-5">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Target Repository</label>
                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                                        {["Fridge", "Freezer", "Dry Goods"].map(r => (
                                            <button type="button" key={r} onClick={() => setModalRoom(r)} className={`px-3 py-1.5 text-[10px] font-bold border rounded-lg transition-all ${modalRoom === r ? 'bg-teal-500 text-[#0b0f17] border-teal-500' : 'text-gray-400 border-[#222936] hover:bg-[#1e2533]'}`}>{r.toUpperCase()}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Class Identifier</label>
                                    <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scroll p-1 bg-[#0b0f17] rounded-lg border border-[#222936]">
                                        {Object.keys(META).map(c => (
                                            <button type="button" key={c} onClick={() => setModalCat(c)} className={`px-2 py-1 text-[9px] font-semibold border rounded transition-all ${modalCat === c ? 'bg-teal-500/20 text-teal-300 border-teal-500/50' : 'text-gray-500 border-transparent hover:text-gray-300'}`}>{c}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-4 pt-2">
                                    <input className="w-full bg-[#0b0f17] border border-[#222936] rounded-lg px-4 py-3 text-sm text-white placeholder-gray-600 outline-none focus:border-teal-500/50 transition-colors" placeholder="Product Descriptor (Name)..." value={newName} onChange={e => handleNameChange(e.target.value)} autoFocus />
                                    
                                    <div className="flex gap-4">
                                        <input className="w-24 bg-[#0b0f17] border border-[#222936] rounded-lg px-4 py-3 text-sm text-white placeholder-gray-600 outline-none focus:border-teal-500/50 transition-colors text-center" placeholder="Qty (1)" value={newQty} onChange={e => setNewQty(e.target.value)} />
                                        <button type="submit" className="flex-1 bg-teal-500 hover:bg-teal-600 text-[#0b0f17] font-black uppercase tracking-wider text-xs rounded-lg transition-all">Commit Entry</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                )}
            </div>
        );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<PantryApp />);
    </script>
</body>
</html>
