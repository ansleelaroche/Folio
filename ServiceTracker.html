<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Service Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Kaiser GMC Service Board</h1>
                <p class="text-gray-500 text-sm mt-1">Live Repair Order Tracking</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition">
                + New RO
            </button>
        </header>

        <!-- Task List -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4 w-1/4">RO & Customer</th>
                        <th class="p-4 w-2/4">Vehicle & Issue</th>
                        <th class="p-4 w-1/4">Status</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <!-- Tasks will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ADD NEW TASK MODAL (Hidden by default) -->
    <div id="taskModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex justify-center items-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Write Up New Vehicle</h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">RO Number</label>
                        <input id="ro_number" type="text" placeholder="e.g. 12345" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Vehicle</label>
                        <input id="vehicle" type="text" placeholder="e.g. 24 Sierra 1500" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Customer Name</label>
                        <input id="customer_name" type="text" placeholder="Last Name, First" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                        <input id="phone_number" type="text" placeholder="(555) 555-5555" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Primary Issue / Description</label>
                    <textarea id="issue_description" rows="3" placeholder="Customer states..." class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <label class="flex items-center space-x-2 p-3 border rounded-lg bg-gray-50 cursor-pointer hover:bg-red-50 transition border-red-100">
                    <input id="is_waiting" type="checkbox" class="h-5 w-5 text-red-600 rounded cursor-pointer">
                    <span class="text-md font-bold text-red-700">Customer is Waiting</span>
                </label>
            </div>

            <div class="mt-8 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-5 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition">Cancel</button>
                <button onclick="addTask()" class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold shadow transition">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Modal Controls
        function openModal() {
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            // Clear inputs on close
            document.getElementById('ro_number').value = '';
            document.getElementById('vehicle').value = '';
            document.getElementById('customer_name').value = '';
            document.getElementById('phone_number').value = '';
            document.getElementById('issue_description').value = '';
            document.getElementById('is_waiting').checked = false;
        }

        // Fetch Tasks
        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('ServiceTracker') 
                .select('*')
                .order('is_waiting', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) console.error('Error:', error.message);
            else renderTasks(tasks);
        }

        // Render Tasks (Updated to combine columns for a cleaner look)
        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(task => `
                <tr class="border-b hover:bg-gray-50 ${task.is_waiting ? 'bg-red-50' : ''}">
                    <td class="p-4 align-top">
                        <div class="font-mono text-lg font-bold text-blue-800">
                            ${task.ro_number}
                            ${task.is_waiting ? '<span class="ml-2 px-2 py-1 bg-red-600 text-white text-xs rounded-full align-middle">WAITING</span>' : ''}
                        </div>
                        <div class="text-sm font-semibold text-gray-800 mt-1">${task.customer_name || 'N/A'}</div>
                        <div class="text-xs text-gray-500">${task.phone_number || ''}</div>
                    </td>
                    <td class="p-4 align-top">
                        <div class="font-bold text-gray-800">${task.vehicle_desc}</div>
                        <div class="text-sm text-gray-600 mt-1 italic w-full max-w-lg break-words">"${task.issue_description || 'No description provided'}"</div>
                    </td>
                    <td class="p-4 align-top">
                        <select onchange="updateStatus(${task.id}, this.value)" class="border p-2 rounded text-sm font-bold bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Shop" ${task.status === 'In Shop' ? 'selected' : ''}>🔧 In Shop</option>
                            <option value="Parts Hold" ${task.status === 'Parts Hold' ? 'selected' : ''}>📦 Parts Hold</option>
                            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        // Update the vehicle's status
        async function updateStatus(taskId, newStatus) {
            const { error } = await _supabase
                .from('ServiceTracker')
                .update({ status: newStatus })
                .eq('id', taskId);

            if (error) {
                console.error('Update Error:', error);
                alert('Error updating status.');
            }
        }

        // Add a new task using the modal
        async function addTask() {
            const ro = document.getElementById('ro_number').value;
            const vehicle = document.getElementById('vehicle').value;
            const customer = document.getElementById('customer_name').value;
            const phone = document.getElementById('phone_number').value;
            const issue = document.getElementById('issue_description').value;
            const waiting = document.getElementById('is_waiting').checked; 

            if (!ro || !vehicle) {
                alert("RO Number and Vehicle are required.");
                return;
            }

            const { error } = await _supabase
                .from('ServiceTracker')
                .insert([{ 
                    ro_number: ro, 
                    vehicle_desc: vehicle, 
                    customer_name: customer,
                    phone_number: phone,
                    issue_description: issue,
                    status: 'Pending',
                    is_waiting: waiting
                }]);

            if (error) {
                console.error('Insert Error:', error);
                alert('Error adding task.');
            } else {
                getTasks(); // Refresh board
                closeModal(); // Close and clear the popup
            }
        }

        // Load the board on startup
        getTasks();
    </script>
</body>
</html>
