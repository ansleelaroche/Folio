<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Live Service Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editable-cell {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .editable-cell:hover {
            border-color: #cbd5e1; 
            background-color: #f8fafc; 
        }
        .editable-cell:focus {
            border-color: #3b82f6; 
            background-color: #ffffff;
            outline: none;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="bg-slate-100 p-2 text-xs font-sans antialiased h-screen overflow-hidden flex flex-col">

    <div class="w-full max-w-[1600px] mx-auto flex flex-col h-full">
        <header class="flex justify-between items-center mb-2 bg-slate-800 p-2 rounded shadow-md border border-slate-700 shrink-0">
            <div class="flex items-baseline space-x-2">
                <h1 class="text-base font-bold text-white tracking-tight">Kaiser GMC</h1>
                <p class="text-slate-400 text-[10px] font-medium uppercase tracking-wide">Live Dispatch</p>
            </div>
            <div class="flex items-center space-x-3">
                <span id="save-toast" class="text-green-400 text-[10px] font-bold opacity-0 transition-opacity duration-300">✓ Saved</span>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 rounded text-xs shadow transition">
                    + New RO
                </button>
            </div>
        </header>

        <div class="bg-white rounded shadow border border-slate-200 flex-1 overflow-auto">
            <table class="w-full text-left min-w-max border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                    <tr>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">RO #</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-36">Customer</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28">Phone</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-40">Vehicle</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Issue Description</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28 text-right">Status</th>
                    </tr>
                </thead>
                <tbody id="task-list" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/60 flex justify-center items-center z-50">
        <div class="bg-white p-4 rounded shadow-2xl w-full max-w-md border border-slate-200">
            <h2 class="text-sm font-bold mb-3 text-slate-800 border-b pb-1">Write Up New Vehicle</h2>
            
            <div class="space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">RO Number</label>
                        <input id="new_ro" type="text" placeholder="12345" class="w-full border border-slate-300 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Vehicle</label>
                        <input id="new_vehicle" type="text" placeholder="24 Sierra 1500" class="w-full border border-slate-300 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Customer Name</label>
                        <input id="new_customer" type="text" placeholder="Last Name" class="w-full border border-slate-300 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Phone Number</label>
                        <input id="new_phone" type="tel" placeholder="(555) 555-5555" class="w-full border border-slate-300 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Primary Issue</label>
                    <textarea id="new_issue" rows="1" placeholder="Customer states..." class="w-full border border-slate-300 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <label class="flex items-center space-x-2 p-1.5 border border-slate-200 rounded bg-slate-50 cursor-pointer hover:bg-red-50 hover:border-red-200 transition">
                    <input id="new_waiting" type="checkbox" class="h-3 w-3 text-red-600 rounded cursor-pointer focus:ring-red-500">
                    <span class="text-xs font-bold text-slate-700">Customer is Waiting</span>
                </label>
            </div>

            <div class="mt-4 flex justify-end space-x-2">
                <button type="button" onclick="closeModal()" class="px-3 py-1 rounded text-xs text-slate-600 hover:bg-slate-100 font-bold border border-slate-200">Cancel</button>
                <button type="button" onclick="addTask()" class="px-3 py-1 bg-slate-800 text-white rounded text-xs hover:bg-slate-700 font-bold shadow-md">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bnnqzijvmsezjlpocpvz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubnF6aWp2bXNlempscG9jcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjczNzMsImV4cCI6MjA5MzgwMzM3M30.UJHZXunhE1gy28pYE_39HIOrFnm4C0laeME9lE19frs';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function openModal() { document.getElementById('taskModal').classList.remove('hidden'); }
        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            ['new_ro', 'new_vehicle', 'new_customer', 'new_phone', 'new_issue'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('new_waiting').checked = false;
        }

        function flashSuccess() {
            const toast = document.getElementById('save-toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('ServiceTracker') 
                .select('*')
                .order('is_waiting', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) console.error('Error fetching:', error.message);
            else renderTasks(tasks);
        }

        async function updateField(taskId, column, value) {
            const payload = {};
            payload[column] = value;

            const { error } = await _supabase
                .from('ServiceTracker')
                .update(payload)
                .eq('id', taskId);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                flashSuccess();
                if (column === 'is_waiting') getTasks();
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(task => `
                <tr class="hover:bg-slate-50 transition duration-150 ${task.is_waiting ? 'bg-red-50/40' : ''}">
                    <td class="px-2 py-1 align-middle">
                        <div class="flex items-center space-x-1">
                            <input type="text" value="${task.ro_number}" onchange="updateField(${task.id}, 'ro_number', this.value)" class="editable-cell w-16 px-1 py-0.5 font-mono text-xs font-bold text-slate-800 rounded">
                            <button onclick="updateField(${task.id}, 'is_waiting', ${!task.is_waiting})" class="px-1 py-0.5 text-[9px] rounded uppercase tracking-wider font-bold ${task.is_waiting ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-200 text-slate-400 hover:bg-slate-300'}">
                                ${task.is_waiting ? 'Wait' : 'Drop'}
                            </button>
                        </div>
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.customer_name || ''}" placeholder="Name..." onchange="updateField(${task.id}, 'customer_name', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-semibold text-slate-800 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.phone_number || ''}" placeholder="Phone..." onchange="updateField(${task.id}, 'phone_number', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] text-slate-600 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.vehicle_desc}" onchange="updateField(${task.id}, 'vehicle_desc', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-bold text-slate-800 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.issue_description || ''}" onchange="updateField(${task.id}, 'issue_description', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] text-slate-600 italic rounded truncate" placeholder="Issue...">
                    </td>
                    <td class="px-2 py-1 align-middle text-right">
                        <select onchange="updateField(${task.id}, 'status', this.value)" class="border border-slate-200 p-1 rounded text-[11px] font-bold bg-white cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-700">
                            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Shop" ${task.status === 'In Shop' ? 'selected' : ''}>🔧 In Shop</option>
                            <option value="Parts Hold" ${task.status === 'Parts Hold' ? 'selected' : ''}>📦 Parts</option>
                            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>✅ Done</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function addTask() {
            const ro = document.getElementById('new_ro').value;
            const vehicle = document.getElementById('new_vehicle').value;
            const customer = document.getElementById('new_customer').value;
            const phone = document.getElementById('new_phone').value;
            const issue = document.getElementById('new_issue').value;
            const waiting = document.getElementById('new_waiting').checked; 

            if (!ro || !vehicle) { alert("RO Number and Vehicle are required."); return; }

            const { error } = await _supabase
                .from('ServiceTracker')
                .insert([{ 
                    ro_number: ro, vehicle_desc: vehicle, customer_name: customer,
                    phone_number: phone, issue_description: issue, status: 'Pending', is_waiting: waiting
                }]);

            if (error) alert('Database Error: ' + error.message);
            else { getTasks(); closeModal(); }
        }

        getTasks();
    </script>
</body>
</html>
