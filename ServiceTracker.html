<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Live Service Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Mode Editable Cells */
        .editable-cell {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
            color: #e2e8f0; 
        }
        .editable-cell:hover {
            border-color: #475569; 
            background-color: #334155; 
        }
        .editable-cell:focus {
            border-color: #3b82f6; 
            background-color: #0f172a; 
            color: #f8fafc; 
            outline: none;
        }
        
        /* Custom Blinking Animation for Past Due Dates */
        @keyframes urgentBlink {
            0%, 100% { background-color: rgba(220, 38, 38, 0.25); color: #fca5a5; }
            50% { background-color: transparent; color: #e2e8f0; }
        }
        .past-due-blink {
            animation: urgentBlink 1.5s ease-in-out infinite;
            border: 1px solid #ef4444 !important;
            font-weight: bold !important;
        }

        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
    </style>
</head>
<body class="bg-slate-950 p-2 text-xs font-sans antialiased h-screen overflow-hidden flex flex-col text-slate-300" style="color-scheme: dark;">

    <div class="w-full max-w-[1600px] mx-auto flex flex-col h-full">
        <header class="flex justify-between items-center mb-2 bg-slate-900 p-2 rounded shadow-md border border-slate-800 shrink-0">
            <div class="flex items-baseline space-x-2">
                <h1 class="text-base font-bold text-white tracking-tight">Kaiser GMC</h1>
                <p class="text-slate-500 text-[10px] font-medium uppercase tracking-wide">Live Dispatch</p>
            </div>
            <div class="flex items-center space-x-3">
                <span id="save-toast" class="text-green-400 text-[10px] font-bold opacity-0 transition-opacity duration-300">✓ Saved</span>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 rounded text-xs shadow transition border border-blue-500">
                    + New RO
                </button>
            </div>
        </header>

        <div class="bg-slate-900 rounded shadow border border-slate-800 flex-1 overflow-auto">
            <table class="w-full text-left min-w-max border-collapse">
                <thead class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
                    <tr>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-20">RO #</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Intake</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-32">Customer</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Phone</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-36">Vehicle</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Issue Description</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24 text-red-400">Est. Date</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24 text-right">Status</th>
                        <th class="px-3 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Completed</th>
                    </tr>
                </thead>
                <tbody id="task-list" class="divide-y divide-slate-800/50">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="taskModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center z-50">
        <div class="bg-slate-800 p-4 rounded shadow-2xl w-full max-w-md border border-slate-700">
            <h2 class="text-sm font-bold mb-3 text-white border-b border-slate-700 pb-1">Write Up New Vehicle</h2>
            
            <div class="space-y-2">
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">RO Number</label>
                        <input id="new_ro" type="text" placeholder="12345" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none placeholder-slate-600">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Vehicle</label>
                        <input id="new_vehicle" type="text" placeholder="24 Sierra 1500" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none placeholder-slate-600">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Intake Date</label>
                        <input id="new_intake" type="date" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-[11px] rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Customer</label>
                        <input id="new_customer" type="text" placeholder="Last Name" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none placeholder-slate-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Phone</label>
                        <input id="new_phone" type="tel" placeholder="(555) 555-5555" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none placeholder-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Primary Issue</label>
                    <textarea id="new_issue" rows="1" placeholder="Customer states..." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none resize-none placeholder-slate-600"></textarea>
                </div>

                <label class="flex items-center space-x-2 p-1.5 border border-slate-700 rounded bg-slate-900/50 cursor-pointer hover:bg-red-900/20 hover:border-red-900/50 transition">
                    <input id="new_waiting" type="checkbox" class="h-3 w-3 text-red-600 bg-slate-800 border-slate-600 rounded cursor-pointer focus:ring-red-500 focus:ring-offset-slate-900">
                    <span class="text-xs font-bold text-slate-300">Customer is Waiting</span>
                </label>
            </div>

            <div class="mt-4 flex justify-end space-x-2">
                <button type="button" onclick="closeModal()" class="px-3 py-1 rounded text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-700 font-bold border border-slate-600 transition">Cancel</button>
                <button type="button" onclick="addTask()" class="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-500 font-bold shadow-md transition">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bnnqzijvmsezjlpocpvz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubnF6aWp2bXNlempscG9jcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjczNzMsImV4cCI6MjA5MzgwMzM3M30.UJHZXunhE1gy28pYE_39HIOrFnm4C0laeME9lE19frs';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function openModal() { 
            document.getElementById('taskModal').classList.remove('hidden'); 
            document.getElementById('new_intake').value = new Date().toISOString().split('T')[0];
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            ['new_ro', 'new_vehicle', 'new_customer', 'new_phone', 'new_issue', 'new_intake'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('new_waiting').checked = false;
        }

        function flashSuccess() {
            const toast = document.getElementById('save-toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('ServiceTracker') 
                .select('*')
                .order('is_waiting', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) console.error('Error fetching:', error.message);
            else renderTasks(tasks);
        }

        async function updateField(taskId, column, value) {
            const payloadValue = value === "" ? null : value;
            const payload = {};
            payload[column] = payloadValue;

            if (column === 'status') {
                if (value === 'Completed') {
                    payload['completed_date'] = new Date().toISOString().split('T')[0];
                } else {
                    payload['completed_date'] = null; 
                }
            }

            const { error } = await _supabase
                .from('ServiceTracker')
                .update(payload)
                .eq('id', taskId);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                flashSuccess();
                // Refresh if status changes or waiting status changes to resort/re-color
                if (column === 'is_waiting' || column === 'status') getTasks();
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            
            // Get today's date formatted as YYYY-MM-DD for comparison
            const todayStr = new Date().toISOString().split('T')[0];

            list.innerHTML = tasks.map(task => {
                // Determine if the Estimated Date is past due
                const isPastDue = task.completion_time && task.completion_time < todayStr && task.status !== 'Completed';

                return `
                <tr class="hover:bg-slate-800 transition duration-150 ${task.is_waiting ? 'bg-red-900/10 border-l-2 border-red-600' : 'border-l-2 border-transparent'}">
                    
                    <td class="px-2 py-1 align-middle">
                        <div class="flex items-center space-x-1">
                            <input type="text" value="${task.ro_number}" onchange="updateField(${task.id}, 'ro_number', this.value)" class="editable-cell w-14 px-1 py-0.5 font-mono text-xs font-bold rounded">
                            <button onclick="updateField(${task.id}, 'is_waiting', ${!task.is_waiting})" class="px-1 py-0.5 text-[9px] rounded uppercase tracking-wider font-bold transition ${task.is_waiting ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}">
                                ${task.is_waiting ? 'Wait' : 'Drop'}
                            </button>
                        </div>
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${task.intake_date || ''}" onchange="updateField(${task.id}, 'intake_date', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.customer_name || ''}" placeholder="Name..." onchange="updateField(${task.id}, 'customer_name', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-semibold rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.phone_number || ''}" placeholder="Phone..." onchange="updateField(${task.id}, 'phone_number', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.vehicle_desc}" onchange="updateField(${task.id}, 'vehicle_desc', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-bold rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.issue_description || ''}" onchange="updateField(${task.id}, 'issue_description', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 italic rounded truncate" placeholder="Issue...">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${task.completion_time || ''}" onchange="updateField(${task.id}, 'completion_time', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] rounded ${isPastDue ? 'past-due-blink' : '!text-slate-400'}">
                    </td>
                    <td class="px-2 py-1 align-middle text-right">
                        <select onchange="updateField(${task.id}, 'status', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 p-1 rounded text-[11px] font-bold cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 hover:border-slate-500 transition">
                            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Shop" ${task.status === 'In Shop' ? 'selected' : ''}>🔧 In Shop</option>
                            <option value="Parts Hold" ${task.status === 'Parts Hold' ? 'selected' : ''}>📦 Parts</option>
                            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>✅ Done</option>
                        </select>
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${task.completed_date || ''}" onchange="updateField(${task.id}, 'completed_date', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                </tr>
            `}).join('');
        }

        async function addTask() {
            const ro = document.getElementById('new_ro').value;
            const vehicle = document.getElementById('new_vehicle').value;
            const customer = document.getElementById('new_customer').value;
            const phone = document.getElementById('new_phone').value;
            const issue = document.getElementById('new_issue').value;
            const intake = document.getElementById('new_intake').value || null;
            const waiting = document.getElementById('new_waiting').checked; 

            if (!ro || !vehicle) { alert("RO Number and Vehicle are required."); return; }

            const { error } = await _supabase
                .from('ServiceTracker')
                .insert([{ 
                    ro_number: ro, vehicle_desc: vehicle, customer_name: customer,
                    phone_number: phone, issue_description: issue, intake_date: intake, 
                    status: 'Pending', is_waiting: waiting
                }]);

            if (error) alert('Database Error: ' + error.message);
            else { getTasks(); closeModal(); }
        }

        // Run the fetch on load, and then refresh it automatically every 60 seconds 
        // to ensure the "Past Due" blinker kicks in even if nobody refreshes the screen!
        getTasks();
        setInterval(getTasks, 60000);
    </script>
</body>
</html>
