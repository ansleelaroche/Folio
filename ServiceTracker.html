<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Kaiser GMC Service & Sales</h1>
            <span class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm">4 Active Users</span>
        </header>

        <!-- Task Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Add New Service Task</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="ro_number" type="text" placeholder="RO #" class="border p-2 rounded">
                <input id="vehicle" type="text" placeholder="Vehicle (Year/Model)" class="border p-2 rounded">
                <select id="dept" class="border p-2 rounded">
                    <option value="Service">Service</option>
                    <option value="Sales">Sales</option>
                </select>
                <button onclick="addTask()" class="md:col-span-3 bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
                    Add Task to Board
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4">RO #</th>
                        <th class="p-4">Vehicle</th>
                        <th class="p-4">Dept</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <!-- Tasks will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Fetch Tasks on Load
        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('tasks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) console.error('Error:', error);
            else renderTasks(tasks);
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(task => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4 font-mono">${task.ro_number}</td>
                    <td class="p-4">${task.vehicle_desc}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs ${task.department === 'Sales' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                            ${task.department}
                        </span>
                    </td>
                    <td class="p-4 text-sm text-gray-600">${task.task_status}</td>
                </tr>
            `).join('');
        }

        async function addTask() {
            const ro = document.getElementById('ro_number').value;
            const vehicle = document.getElementById('vehicle').value;
            const dept = document.getElementById('dept').value;

            const { error } = await _supabase
                .from('tasks')
                .insert([{ ro_number: ro, vehicle_desc: vehicle, department: dept, task_status: 'Pending' }]);

            if (error) alert('Error adding task');
            else {
                getTasks(); // Refresh list
                document.getElementById('ro_number').value = '';
                document.getElementById('vehicle').value = '';
            }
        }

        // Initial Load
        getTasks();
    </script>
</body>
</html>
