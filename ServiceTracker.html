<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Live Service Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to hide input borders until hover/focus for that clean spreadsheet feel */
        .editable-cell {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .editable-cell:hover {
            border-color: #cbd5e1; /* slate-300 */
            background-color: #f8fafc; /* slate-50 */
        }
        .editable-cell:focus {
            border-color: #3b82f6; /* blue-500 */
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        /* Custom scrollbar for textareas */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-6 text-sm font-sans antialiased">

    <div class="max-w-[1400px] mx-auto">
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Kaiser GMC <span class="text-slate-400 font-medium">| Service Board</span></h1>
                <p class="text-slate-400 text-xs mt-1 font-medium tracking-wide uppercase">Live Repair Order Tracking</p>
            </div>
            <div class="flex items-center space-x-4">
                <span id="save-toast" class="text-green-400 text-xs font-bold opacity-0 transition-opacity duration-300">✓ Saved</span>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-5 rounded-lg text-sm shadow transition duration-200">
                    + New RO
                </button>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left min-w-max border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider w-32">RO # & Priority</th>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider w-48">Customer Name</th>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">Phone</th>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider w-56">Vehicle</th>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider">Issue Description</th>
                        <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider w-40 text-right">Status</th>
                    </tr>
                </thead>
                <tbody id="task-list" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg border border-slate-200">
            <h2 class="text-xl font-bold mb-5 text-slate-800">Write Up New Vehicle</h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">RO Number</label>
                        <input id="new_ro" type="text" placeholder="e.g. 12345" class="w-full border border-slate-300 p-2 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Vehicle</label>
                        <input id="new_vehicle" type="text" placeholder="e.g. 24 Sierra 1500" class="w-full border border-slate-300 p-2 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Customer Name</label>
                        <input id="new_customer" type="text" placeholder="Last Name, First" class="w-full border border-slate-300 p-2 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Phone Number</label>
                        <input id="new_phone" type="tel" placeholder="(555) 555-5555" class="w-full border border-slate-300 p-2 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Primary Issue / Description</label>
                    <textarea id="new_issue" rows="2" placeholder="Customer states..." class="w-full border border-slate-300 p-2 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
                </div>

                <label class="flex items-center space-x-3 p-3 border border-slate-200 rounded-lg bg-slate-50 cursor-pointer hover:bg-red-50 hover:border-red-200 transition group">
                    <input id="new_waiting" type="checkbox" class="h-4 w-4 text-red-600 rounded cursor-pointer border-slate-300 focus:ring-red-500">
                    <span class="text-sm font-bold text-slate-700 group-hover:text-red-700 transition">Customer is Waiting</span>
                </label>
            </div>

            <div class="mt-8 flex justify-end space-x-3">
                <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 font-bold transition">Cancel</button>
                <button type="button" onclick="addTask()" class="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-700 font-bold shadow-md transition">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://bnnqzijvmsezjlpocpvz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubnF6aWp2bXNlempscG9jcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjczNzMsImV4cCI6MjA5MzgwMzM3M30.UJHZXunhE1gy28pYE_39HIOrFnm4C0laeME9lE19frs';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // UI Controls
        function openModal() { document.getElementById('taskModal').classList.remove('hidden'); }
        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            ['new_ro', 'new_vehicle', 'new_customer', 'new_phone', 'new_issue'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('new_waiting').checked = false;
        }

        // Show a brief "Saved" confirmation in the header
        function flashSuccess() {
            const toast = document.getElementById('save-toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // Fetch Data
        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('ServiceTracker') 
                .select('*')
                .order('is_waiting', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) console.error('Error fetching:', error.message);
            else renderTasks(tasks);
        }

        // The Magic function: Updates ANY field instantly
        async function updateField(taskId, column, value) {
            const payload = {};
            payload[column] = value;

            const { error } = await _supabase
                .from('ServiceTracker')
                .update(payload)
                .eq('id', taskId);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                flashSuccess();
                // If they change the waiting status, refresh the board so it resorts the list immediately
                if (column === 'is_waiting') getTasks();
            }
        }

        // Render the Editable Table
        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(task => `
                <tr class="hover:bg-slate-50 transition duration-150 ${task.is_waiting ? 'bg-red-50/40 hover:bg-red-50/70' : ''}">
                    
                    <td class="px-4 py-3 align-top">
                        <input type="text" value="${task.ro_number}" onchange="updateField(${task.id}, 'ro_number', this.value)" class="editable-cell w-full px-2 py-1 font-mono text-sm font-bold text-slate-800 rounded">
                        <button onclick="updateField(${task.id}, 'is_waiting', ${!task.is_waiting})" class="mt-1 ml-2 px-2 py-0.5 text-[10px] rounded uppercase tracking-wider font-bold transition ${task.is_waiting ? 'bg-red-600 text-white hover:bg-red-700 shadow-sm' : 'bg-slate-200 text-slate-500 hover:bg-slate-300'}">
                            ${task.is_waiting ? 'Waiting' : 'Drop-off'}
                        </button>
                    </td>

                    <td class="px-4 py-3 align-top">
                        <input type="text" value="${task.customer_name || ''}" placeholder="Name..." onchange="updateField(${task.id}, 'customer_name', this.value)" class="editable-cell w-full px-2 py-1 text-sm font-semibold text-slate-800 rounded">
                    </td>

                    <td class="px-4 py-3 align-top">
                        <input type="text" value="${task.phone_number || ''}" placeholder="Phone..." onchange="updateField(${task.id}, 'phone_number', this.value)" class="editable-cell w-full px-2 py-1 text-xs text-slate-600 rounded">
                    </td>

                    <td class="px-4 py-3 align-top">
                        <input type="text" value="${task.vehicle_desc}" onchange="updateField(${task.id}, 'vehicle_desc', this.value)" class="editable-cell w-full px-2 py-1 text-sm font-bold text-slate-800 rounded">
                    </td>

                    <td class="px-4 py-3 align-top">
                        <textarea onchange="updateField(${task.id}, 'issue_description', this.value)" rows="2" class="editable-cell w-full px-2 py-1 text-xs text-slate-600 italic rounded resize-none min-w-[200px]" placeholder="Issue description...">${task.issue_description || ''}</textarea>
                    </td>

                    <td class="px-4 py-3 align-top text-right">
                        <select onchange="updateField(${task.id}, 'status', this.value)" class="border border-slate-200 p-1.5 rounded-lg text-xs font-bold bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-slate-700 hover:border-slate-300 transition">
                            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Shop" ${task.status === 'In Shop' ? 'selected' : ''}>🔧 In Shop</option>
                            <option value="Parts Hold" ${task.status === 'Parts Hold' ? 'selected' : ''}>📦 Parts Hold</option>
                            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        // Add a new task from the modal
        async function addTask() {
            const ro = document.getElementById('new_ro').value;
            const vehicle = document.getElementById('new_vehicle').value;
            const customer = document.getElementById('new_customer').value;
            const phone = document.getElementById('new_phone').value;
            const issue = document.getElementById('new_issue').value;
            const waiting = document.getElementById('new_waiting').checked; 

            if (!ro || !vehicle) { alert("RO Number and Vehicle are required."); return; }

            const { error } = await _supabase
                .from('ServiceTracker')
                .insert([{ 
                    ro_number: ro, vehicle_desc: vehicle, customer_name: customer,
                    phone_number: phone, issue_description: issue, status: 'Pending', is_waiting: waiting
                }]);

            if (error) alert('Database Error: ' + error.message);
            else { getTasks(); closeModal(); }
        }

        // Initial Load
        getTasks();
    </script>
</body>
</html>
