<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Live Service Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editable-cell {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
            color: #e2e8f0; 
        }
        .editable-cell:hover { border-color: #475569; background-color: #334155; }
        .editable-cell:focus { border-color: #3b82f6; background-color: #0f172a; color: #f8fafc; outline: none; }
        
        @keyframes urgentBlink {
            0%, 100% { background-color: rgba(220, 38, 38, 0.3); color: #fca5a5; border-color: rgba(239, 68, 68, 1); }
            50% { background-color: transparent; color: #e2e8f0; border-color: transparent; }
        }
        .past-due-blink { animation: urgentBlink 1.5s ease-in-out infinite !important; font-weight: bold !important; border-style: solid !important; border-width: 1px !important; }

        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
    </style>
</head>
<body class="bg-slate-950 text-xs font-sans antialiased h-screen overflow-hidden flex flex-col text-slate-300" style="color-scheme: dark;">

    <!-- LOGIN SCREEN OVERLAY -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex flex-col justify-center items-center z-[100]">
        <div class="bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800 w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-white mb-1">Kaiser GMC</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-8">Service Dispatch Login</p>
            
            <div class="text-left mb-6">
                <label class="block text-xs font-bold text-slate-400 mb-2">Select Advisor</label>
                <select id="user-select" class="w-full bg-slate-950 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-bold cursor-pointer">
                    <option value="" disabled selected>-- Select your name --</option>
                    <option value="Frank LaRoche">Frank LaRoche</option>
                    <option value="Matt Cannoy">Matt Cannoy</option>
                    <option value="Michael Macmillian">Michael Macmillian</option>
                    <option value="Michael Burch">Michael Burch</option>
                </select>
            </div>
            
            <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                Access Board
            </button>
        </div>
    </div>

    <!-- MAIN APPLICATION CONTAINER -->
    <div id="app-container" class="hidden w-full max-w-[1600px] mx-auto flex flex-col h-full p-2">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-2 bg-slate-900 p-2 rounded shadow-md border border-slate-800 shrink-0">
            <div class="flex items-center space-x-4">
                <div>
                    <h1 class="text-base font-bold text-white tracking-tight leading-none">Kaiser GMC</h1>
                    <p class="text-slate-500 text-[10px] font-medium uppercase tracking-wide">Live Dispatch</p>
                </div>
                
                <!-- View Switcher -->
                <button id="switch-view-btn" onclick="toggleAdvisorView()" class="hidden text-[10px] font-bold bg-slate-800 text-blue-400 px-3 py-1.5 rounded border border-blue-900 hover:bg-slate-700 hover:text-blue-300 transition shadow-sm">
                    Viewing: Frank's ROs (Swap)
                </button>

                <!-- Show Completed Toggle -->
                <label class="flex items-center space-x-1.5 cursor-pointer bg-slate-800 px-2 py-1 rounded border border-slate-700 hover:bg-slate-700 transition">
                    <input type="checkbox" id="toggle-completed" onchange="toggleCompleted()" class="h-3 w-3 rounded bg-slate-900 border-slate-600 focus:ring-blue-500 cursor-pointer">
                    <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wide">Show Completed</span>
                </label>
            </div>

            <div class="flex items-center space-x-3">
                <span class="text-slate-500 text-[10px] font-bold uppercase tracking-wide">Logged in: <span id="display-user" class="text-white"></span></span>
                <button onclick="logoutUser()" class="text-[10px] font-bold text-red-400 hover:text-red-300 transition mr-2">Logout</button>
                <span id="save-toast" class="text-green-400 text-[10px] font-bold opacity-0 transition-opacity duration-300">✓ Saved</span>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 rounded text-xs shadow transition border border-blue-500">
                    + New RO
                </button>
            </div>
        </header>

        <!-- Task List -->
        <div class="bg-slate-900 rounded shadow border border-slate-800 flex-1 overflow-auto">
            <table class="w-full text-left min-w-max border-collapse">
                <thead class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
                    <tr>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-16">RO #</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Type</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Intake</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-20">Advisor</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-20">Tech</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28">Customer</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Phone</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-36">Vehicle</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Issue Description</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24 text-red-400">Est. Date</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24 text-right">Status</th>
                        <th class="px-2 py-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">Completed</th>
                    </tr>
                </thead>
                <tbody id="task-list" class="divide-y divide-slate-800/50">
                    <!-- Tasks load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ADD NEW TASK MODAL -->
    <div id="taskModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center z-50">
        <div class="bg-slate-800 p-4 rounded shadow-2xl w-full max-w-lg border border-slate-700">
            <h2 class="text-sm font-bold mb-3 text-white border-b border-slate-700 pb-1">Write Up New Vehicle</h2>
            
            <div class="space-y-3">
                <div class="grid grid-cols-4 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">RO Number</label>
                        <input id="new_ro" type="text" placeholder="12345" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Tech</label>
                        <select id="new_tech" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-[11px] rounded focus:ring-1 focus:ring-blue-500 outline-none cursor-pointer">
                            <option value="" selected>None</option>
                            <option value="1166">1166</option>
                            <option value="1197">1197</option>
                            <option value="1915">1915</option>
                            <option value="1956">1956</option>
                            <option value="2107">2107</option>
                            <option value="2116">2116</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Vehicle</label>
                        <input id="new_vehicle" type="text" placeholder="24 Sierra 1500" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Intake Date</label>
                        <input id="new_intake" type="date" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-[11px] rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Intake Type</label>
                        <select id="new_waiting" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-[11px] rounded focus:ring-1 focus:ring-blue-500 outline-none cursor-pointer">
                            <option value="Drop Off" selected>Drop Off</option>
                            <option value="Waiting">Waiting</option>
                            <option value="Tow In">Tow In</option>
                            <option value="Shuttle">Shuttle</option>
                            <option value="Loaner">Loaner</option>
                            <option value="Off Site">Off Site</option>
                            <option value="Kaiser">Kaiser</option>
                            <option value="Employee">Employee</option>
                            <option value="Body Shop">Body Shop</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Customer</label>
                        <input id="new_customer" type="text" placeholder="Last Name" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Phone</label>
                        <input id="new_phone" type="tel" placeholder="(555) 555-5555" class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-0.5">Primary Issue</label>
                    <textarea id="new_issue" rows="1" placeholder="Customer states..." class="w-full bg-slate-900 border border-slate-600 text-slate-200 p-1 text-xs rounded focus:ring-1 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>
            </div>

            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-700 pt-3">
                <button type="button" onclick="closeModal()" class="px-3 py-1 rounded text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-700 font-bold border border-slate-600 transition">Cancel</button>
                <button type="button" onclick="addTask()" class="px-3 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-500 font-bold shadow-md transition">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bnnqzijvmsezjlpocpvz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubnF6aWp2bXNlempscG9jcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjczNzMsImV4cCI6MjA5MzgwMzM3M30.UJHZXunhE1gy28pYE_39HIOrFnm4C0laeME9lE19frs';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = '';
        let viewFilter = ''; 
        let showCompleted = false;

        function formatSafeDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('-') && dateStr.length >= 10) {
                return dateStr.split('T')[0]; 
            }

            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return ''; 
            
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            
            return `${yyyy}-${mm}-${dd}`;
        }

        function loginUser() {
            const select = document.getElementById('user-select');
            currentUser = select.value;
            
            if (!currentUser) { alert("Please select your name."); return; }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('display-user').innerText = currentUser.split(' ')[0];

            if (currentUser === 'Frank LaRoche' || currentUser === 'Matt Cannoy') {
                viewFilter = currentUser; 
                document.getElementById('switch-view-btn').classList.remove('hidden');
                updateSwitchButtonText();
            } else {
                viewFilter = 'ALL'; 
                document.getElementById('switch-view-btn').classList.add('hidden');
            }

            getTasks();
        }

        function logoutUser() {
            currentUser = '';
            document.getElementById('user-select').value = '';
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        function toggleAdvisorView() {
            viewFilter = (viewFilter === 'Frank LaRoche') ? 'Matt Cannoy' : 'Frank LaRoche';
            updateSwitchButtonText();
            getTasks(); 
        }

        function updateSwitchButtonText() {
            const firstName = viewFilter.split(' ')[0];
            document.getElementById('switch-view-btn').innerText = `Viewing: ${firstName}'s ROs (Swap)`;
        }

        function toggleCompleted() {
            showCompleted = document.getElementById('toggle-completed').checked;
            getTasks();
        }

        function openModal() { 
            document.getElementById('taskModal').classList.remove('hidden'); 
            const offset = new Date().getTimezoneOffset() * 60000;
            document.getElementById('new_intake').value = new Date(Date.now() - offset).toISOString().split('T')[0];
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            ['new_ro', 'new_vehicle', 'new_customer', 'new_phone', 'new_issue', 'new_intake', 'new_tech'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('new_waiting').value = 'Drop Off';
        }

        function flashSuccess() {
            const toast = document.getElementById('save-toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        async function getTasks() {
            if (!currentUser) return;

            let query = _supabase.from('servicetracker').select('*');

            if (!showCompleted) {
                // Keep the filter strict to catch both existing lowercase matches and exact new matches
                query = query.neq('status', 'Completed').neq('status', 'completed').neq('status', 'COMPLETED');
            }

            if (viewFilter !== 'ALL') {
                query = query.eq('assigned_user', viewFilter);
            }

            query = query.order('is_waiting', { ascending: false }).order('created_at', { ascending: false });

            const { data: tasks, error } = await query;
            if (error) console.error('Error fetching:', error.message);
            else renderTasks(tasks);
        }

        async function updateField(taskId, column, value) {
            const payloadValue = value === "" ? null : value;
            const payload = {};
            payload[column] = payloadValue;

            if (column === 'status') {
                if (value === 'Completed') {
                    const offset = new Date().getTimezoneOffset() * 60000;
                    payload['completed_date'] = new Date(Date.now() - offset).toISOString().split('T')[0];
                } else {
                    payload['completed_date'] = null; 
                }
            }

            const { error } = await _supabase.from('servicetracker').update(payload).eq('id', taskId);

            if (error) alert('Error saving data: ' + error.message);
            else {
                flashSuccess();
                if (column === 'is_waiting' || column === 'status' || column === 'completion_time') {
                    getTasks();
                }
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            const offset = new Date().getTimezoneOffset() * 60000;
            const todayStr = new Date(Date.now() - offset).toISOString().split('T')[0];

            list.innerHTML = tasks.map(task => {
                
                const safeIntake = formatSafeDate(task.intake_date);
                const safeCompletion = formatSafeDate(task.completion_time);
                const safeCompleted = formatSafeDate(task.completed_date);

                // This still cleans up ALL CAPS behind the scenes so the dropdown knows which one to show
                const cleanStatus = task.status ? task.status.trim().toLowerCase() : '';

                const isPastDue = safeCompletion && safeCompletion < todayStr && cleanStatus !== 'completed';
                const isCustomerWaiting = task.is_waiting === 'Waiting';

                return `
                <tr class="hover:bg-slate-800 transition duration-150 ${isCustomerWaiting ? 'bg-red-900/10 border-l-2 border-red-600' : 'border-l-2 border-transparent'}">
                    
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.ro_number}" onchange="updateField(${task.id}, 'ro_number', this.value)" class="editable-cell w-full px-1 py-0.5 font-mono text-xs font-bold rounded">
                    </td>

                    <td class="px-2 py-1 align-middle">
                        <select onchange="updateField(${task.id}, 'is_waiting', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 p-1 rounded text-[10px] font-bold cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 hover:border-slate-500 transition w-full ${isCustomerWaiting ? 'text-red-400 border-red-900' : ''}">
                            <option value="Drop Off" ${task.is_waiting === 'Drop Off' ? 'selected' : ''}>Drop Off</option>
                            <option value="Waiting" ${task.is_waiting === 'Waiting' ? 'selected' : ''}>Waiting</option>
                            <option value="Tow In" ${task.is_waiting === 'Tow In' ? 'selected' : ''}>Tow In</option>
                            <option value="Shuttle" ${task.is_waiting === 'Shuttle' ? 'selected' : ''}>Shuttle</option>
                            <option value="Loaner" ${task.is_waiting === 'Loaner' ? 'selected' : ''}>Loaner</option>
                            <option value="Off Site" ${task.is_waiting === 'Off Site' ? 'selected' : ''}>Off Site</option>
                            <option value="Kaiser" ${task.is_waiting === 'Kaiser' ? 'selected' : ''}>Kaiser</option>
                            <option value="Employee" ${task.is_waiting === 'Employee' ? 'selected' : ''}>Employee</option>
                            <option value="Body Shop" ${task.is_waiting === 'Body Shop' ? 'selected' : ''}>Body Shop</option>
                        </select>
                    </td>

                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${safeIntake}" onchange="updateField(${task.id}, 'intake_date', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle text-[10px] font-bold text-blue-400">
                        ${task.assigned_user ? task.assigned_user.split(' ')[0] : 'None'}
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <select onchange="updateField(${task.id}, 'tech_number', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 p-1 rounded text-[10px] font-bold cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 hover:border-slate-500 transition w-full">
                            <option value="" ${!task.tech_number ? 'selected' : ''}>Assign...</option>
                            <option value="1166" ${task.tech_number === '1166' ? 'selected' : ''}>1166</option>
                            <option value="1197" ${task.tech_number === '1197' ? 'selected' : ''}>1197</option>
                            <option value="1915" ${task.tech_number === '1915' ? 'selected' : ''}>1915</option>
                            <option value="1956" ${task.tech_number === '1956' ? 'selected' : ''}>1956</option>
                            <option value="2107" ${task.tech_number === '2107' ? 'selected' : ''}>2107</option>
                            <option value="2116" ${task.tech_number === '2116' ? 'selected' : ''}>2116</option>
                        </select>
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.customer_name || ''}" placeholder="Name..." onchange="updateField(${task.id}, 'customer_name', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-semibold rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.phone_number || ''}" placeholder="Phone..." onchange="updateField(${task.id}, 'phone_number', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.vehicle_desc}" onchange="updateField(${task.id}, 'vehicle_desc', this.value)" class="editable-cell w-full px-1 py-0.5 text-xs font-bold rounded">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="text" value="${task.issue_description || ''}" onchange="updateField(${task.id}, 'issue_description', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 italic rounded truncate" placeholder="Issue...">
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${safeCompletion}" onchange="updateField(${task.id}, 'completion_time', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] rounded transition-all duration-300 ${isPastDue ? 'past-due-blink' : '!text-slate-400'}">
                    </td>
                    <td class="px-2 py-1 align-middle text-right">
                        <!-- PERFECT TITLE CASE OPTIONS -->
                        <select onchange="updateField(${task.id}, 'status', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 p-1 rounded text-[11px] font-bold cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 hover:border-slate-500 transition">
                            <option value="Pending" ${cleanStatus === 'pending' || !cleanStatus ? 'selected' : ''}>Pending</option>
                            <option value="In Shop" ${cleanStatus === 'in shop' ? 'selected' : ''}>In Shop</option>
                            <option value="Parts Hold" ${cleanStatus === 'parts hold' || cleanStatus === 'partshold' ? 'selected' : ''}>Parts Hold</option>
                            <option value="Completed" ${cleanStatus === 'completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td class="px-2 py-1 align-middle">
                        <input type="date" value="${safeCompleted}" onchange="updateField(${task.id}, 'completed_date', this.value)" class="editable-cell w-full px-1 py-0.5 text-[11px] !text-slate-400 rounded">
                    </td>
                </tr>
            `}).join('');
        }

        async function addTask() {
            const ro = document.getElementById('new_ro').value;
            const vehicle = document.getElementById('new_vehicle').value;
            const customer = document.getElementById('new_customer').value;
            const phone = document.getElementById('new_phone').value;
            const issue = document.getElementById('new_issue').value;
            const intake = document.getElementById('new_intake').value || null;
            const tech = document.getElementById('new_tech').value || null;
            const waitingType = document.getElementById('new_waiting').value; 

            if (!ro || !vehicle) { alert("RO Number and Vehicle are required."); return; }

            const { error } = await _supabase
                .from('servicetracker')
                .insert([{ 
                    ro_number: ro, vehicle_desc: vehicle, customer_name: customer,
                    phone_number: phone, issue_description: issue, intake_date: intake, 
                    tech_number: tech, status: 'Pending', 
                    is_waiting: waitingType, 
                    assigned_user: currentUser
                }]);

            if (error) alert('Database Error: ' + error.message);
            else { getTasks(); closeModal(); }
        }

        setInterval(getTasks, 60000);
    </script>
</body>
</html>
