<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser GMC | Service Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 md:p-4 text-sm">

    <div class="max-w-full mx-auto">
        <header class="flex justify-between items-center mb-4 bg-white p-3 rounded shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Kaiser GMC Service Board</h1>
                <p class="text-gray-500 text-xs mt-0.5">Live Repair Order Tracking</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-4 rounded text-sm shadow-sm transition">
                + New RO
            </button>
        </header>

        <div class="bg-white rounded shadow-sm overflow-x-auto">
            <table class="w-full text-left min-w-max">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">RO #</th>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">Customer Name</th>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">Phone</th>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">Vehicle</th>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">Issue Description</th>
                        <th class="px-3 py-2 text-xs font-semibold text-gray-600 uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="taskModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-2xl w-full max-w-lg">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Write Up New Vehicle</h2>
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">RO Number</label>
                        <input id="ro_number" type="text" placeholder="e.g. 12345" class="w-full border p-1.5 text-sm rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Vehicle</label>
                        <input id="vehicle" type="text" placeholder="e.g. 24 Sierra 1500" class="w-full border p-1.5 text-sm rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Customer Name</label>
                        <input id="customer_name" type="text" placeholder="Last Name, First" class="w-full border p-1.5 text-sm rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Phone Number</label>
                        <input id="phone_number" type="tel" placeholder="(555) 555-5555" class="w-full border p-1.5 text-sm rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Primary Issue / Description</label>
                    <textarea id="issue_description" rows="2" placeholder="Customer states..." class="w-full border p-1.5 text-sm rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <label class="flex items-center space-x-2 p-2 border rounded bg-gray-50 cursor-pointer hover:bg-red-50 transition border-red-100">
                    <input id="is_waiting" type="checkbox" class="h-4 w-4 text-red-600 rounded cursor-pointer">
                    <span class="text-sm font-bold text-red-700">Customer is Waiting</span>
                </label>
            </div>

            <div class="mt-6 flex justify-end space-x-2">
                <button type="button" onclick="closeModal()" class="px-4 py-1.5 border rounded text-sm text-gray-600 hover:bg-gray-100 font-semibold transition">Cancel</button>
                <button type="button" onclick="addTask()" class="px-4 py-1.5 bg-green-600 text-white rounded text-sm hover:bg-green-700 font-bold shadow-sm transition">Save to Board</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bnnqzijvmsezjlpocpvz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubnF6aWp2bXNlempscG9jcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjczNzMsImV4cCI6MjA5MzgwMzM3M30.UJHZXunhE1gy28pYE_39HIOrFnm4C0laeME9lE19frs';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function openModal() {
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            document.getElementById('ro_number').value = '';
            document.getElementById('vehicle').value = '';
            document.getElementById('customer_name').value = '';
            document.getElementById('phone_number').value = '';
            document.getElementById('issue_description').value = '';
            document.getElementById('is_waiting').checked = false;
        }

        async function getTasks() {
            const { data: tasks, error } = await _supabase
                .from('ServiceTracker') 
                .select('*')
                .order('is_waiting', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) console.error('Error fetching:', error.message);
            else renderTasks(tasks);
        }

        function renderTasks(tasks) {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(task => `
                <tr class="border-b hover:bg-gray-50 ${task.is_waiting ? 'bg-red-50' : ''}">
                    <td class="px-3 py-2 align-middle font-mono text-sm font-bold text-blue-800 whitespace-nowrap">
                        ${task.ro_number}
                        ${task.is_waiting ? '<br><span class="inline-block mt-0.5 px-1.5 py-0.5 bg-red-600 text-white text-[9px] rounded uppercase tracking-wider">Waiting</span>' : ''}
                    </td>
                    <td class="px-3 py-2 align-middle text-sm font-semibold text-gray-800 whitespace-nowrap">
                        ${task.customer_name || 'N/A'}
                    </td>
                    <td class="px-3 py-2 align-middle text-xs text-gray-600 whitespace-nowrap">
                        ${task.phone_number || 'N/A'}
                    </td>
                    <td class="px-3 py-2 align-middle text-sm font-bold text-gray-800 whitespace-nowrap">
                        ${task.vehicle_desc}
                    </td>
                    <td class="px-3 py-2 align-middle text-xs text-gray-600 italic max-w-xs truncate" title="${task.issue_description || ''}">
                        "${task.issue_description || 'No description'}"
                    </td>
                    <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <select onchange="updateStatus(${task.id}, this.value)" class="border border-gray-300 p-1 rounded text-xs font-bold bg-white cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-sm">
                            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Shop" ${task.status === 'In Shop' ? 'selected' : ''}>🔧 In Shop</option>
                            <option value="Parts Hold" ${task.status === 'Parts Hold' ? 'selected' : ''}>📦 Parts Hold</option>
                            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(taskId, newStatus) {
            const { error } = await _supabase
                .from('ServiceTracker')
                .update({ status: newStatus })
                .eq('id', taskId);

            if (error) alert('Error updating status: ' + error.message);
        }

        async function addTask() {
            const ro = document.getElementById('ro_number').value;
            const vehicle = document.getElementById('vehicle').value;
            const customer = document.getElementById('customer_name').value;
            const phone = document.getElementById('phone_number').value;
            const issue = document.getElementById('issue_description').value;
            const waiting = document.getElementById('is_waiting').checked; 

            if (!ro || !vehicle) {
                alert("RO Number and Vehicle are required.");
                return;
            }

            const { error } = await _supabase
                .from('ServiceTracker')
                .insert([{ 
                    ro_number: ro, 
                    vehicle_desc: vehicle, 
                    customer_name: customer,
                    phone_number: phone,
                    issue_description: issue,
                    status: 'Pending',
                    is_waiting: waiting
                }]);

            if (error) {
                console.error('Insert Error:', error);
                alert('Database Error: ' + error.message);
            } else {
                getTasks(); 
                closeModal(); 
            }
        }

        getTasks();
    </script>
</body>
</html>
